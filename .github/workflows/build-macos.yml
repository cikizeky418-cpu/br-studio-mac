# Build otomatis aplikasi macOS BR Studio (.dmg)
# Runner: macOS ARM64 (Apple Silicon). FREE tier GitHub Actions.
name: Build macOS (.dmg)

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14  # ARM64 (M1/M2/M3). Intel tidak didukung build ini.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install --upgrade pip pyinstaller

      - name: Verifikasi tkinter tersedia
        run: python3 -c "import tkinter; print('Tk OK', tkinter.TkVersion)"

      - name: Build .app dengan PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name "BR Studio" \
            --osx-bundle-identifier "com.brstudio.app" \
            --add-data "firebase_config.json:." \
            app.py
          ls -la dist/

      - name: Verifikasi bundle
        run: |
          test -d "dist/BR Studio.app" || (echo "BR Studio.app tidak ditemukan" && exit 1)
          file "dist/BR Studio.app/Contents/MacOS/BR Studio"
          du -sh "dist/BR Studio.app"

      - name: Buat .dmg
        run: |
          hdiutil create \
            -volname "BR Studio" \
            -srcfolder "dist/BR Studio.app" \
            -ov -format UDZO \
            "dist/BRStudio.dmg"
          ls -la dist/BRStudio.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRStudio-macOS-ARM64
          path: dist/BRStudio.dmg

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: "BR Studio v1.0 (macOS ARM64)"
          body: |
            Aplikasi desktop BR Studio untuk macOS (Apple Silicon).

            Cara install:
            1. Download BRStudio.dmg
            2. Buka → seret BR Studio ke Applications
            3. Klik kanan → Open saat pertama kali dibuka (aplikasi unsigned)

            Login memakai akun BR Studio yang sudah ada (sama seperti versi
            Windows) — data tersambung ke database BR Studio yang sama.
          files: dist/BRStudio.dmg
